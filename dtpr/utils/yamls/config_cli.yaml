# ---------------------------------- posible optional arguments ---------------------------------- #
opt_args:
    config-path: &config_path
        flags: ["-cf", "--config-file"]
        dest: "config_file"
        type: str
        help: "Path to the configuration file."
    input-path: &input_path
        flags: ["-i", "--inputpath"]
        dest: "inpath"
        type: str
        nargs: "+"
        default: "/lustrefs/hdd_pool_dir/L1T/Filter/ZprimeToMuMu_M-6000_simHits/"
        help: "Path to DTNTuple files (.root). This can be either a specific file or a directory containing multiple .root files."
    output-path: &output_path
        flags: ["-o", "--outputpath"]
        dest: "outfolder"
        type: str
        default: "./results"
        help: "Directory to save the output files. If the directory does not exist, it will be created automatically."
    tag: &tag
        flags: ["-t", "--tag"]
        dest: "tag"
        type: str
        default: ""
        help: "Tag to be added to the output file names."
    max-files: &max_files
        flags: ["--maxfiles"]
        dest: "maxfiles"
        type: int
        default: -1
        help: "Maximum number of files to read from the specified INPATH. -1 is default to read all available files."
    max-events: &max_events
        flags: ["--maxevents"]
        dest: "maxevents"
        type: int
        default: -1
        help: "Maximum number of Events to read from the specified INPATH. -1 is default to read all available Events."
    event-number: &event_number
        flags: ["-evn", "--event-number"]
        dest: "event_number"
        type: "lambda arg: int(arg) if arg.lstrip('-').isdigit() else arg"
        default: 0
        help: "Event number to be analyzed. Default is 0."
    wheel: &wheel
        flags: ["-wh", "--wheel"]
        dest: "wheel"
        type: int
        default: -2
        help: "Wheel number to be analyzed. Default is -2."
    sector: &sector
        flags: ["-sc", "--sector"]
        dest: "sector"
        type: int
        default: 1
        help: "Sector number to be analyzed. Default is 1."
    station: &station
        flags: ["-st", "--station"]
        dest: "station"
        type: int
        default: 1
        help: "Station number to be analyzed. Default is 1."
    save: &save
        flags: ["-s", "--save"]
        dest: "save"
        action: "store_true"
        help: "Save the products of the analysis. Default is False."
    debug: &debug
        flags: ["--debug"]
        dest: "debug"
        action: "store_true"
        help: "Print debug information. Default is False."
    template-name: &template_name
        flags: ["-n", "--name"]
        dest: "name"
        type: str
        default: "analysis_template"
        help: "Name of the template."
    artist-names: &artist_names
        flags: ["--artist-names"]
        dest: "artist_names"
        type: str
        nargs: "*"
        help: "Artist name(s) to include. Can be a single string or multiple strings."
    cores-number: &cores_number
        flags: ["-c", "--cores"]
        dest: "ncores"
        type: int
        default: -1
        help: "Number of CPU cores to use for parallel processing. Default is -1, which means no parallelization. 0 uses every core."
    no-merge: &no_merge
        flags: ["--no-merge"]
        dest: "merge"
        action: "store_false"
        help: "Write one ROOT file per chunk and keep them instead of merging them into the final file. Merge them by hand with 'hadd'."
    job-id: &job_id
        flags: ["--job-id"]
        dest: "job_id"
        type: int
        default: 0
        help: "Index of this job when the entries are split across machines. Default is 0."
    job-count: &job_count
        flags: ["--job-count"]
        dest: "job_count"
        type: int
        default: 1
        help: "Number of jobs the entries are split across. Default is 1, a single job."
    use-executable: &use_executable
        flags: ["-e", "--exec"]
        dest: "use_executable"
        action: "store_true"
        help: "Use the pre-built executable. Default is False."
    format: &format
        flags: ["-f", "--format"]
        dest: "format"
        type: str
        choices: ["ttree", "rntuple"]
        default: "ttree"
        help: "Output format for dumped events. Choose 'ttree' or 'rntuple'. Default is 'ttree'."
    dump-yaml: &dump_yaml
        flags: ["--no-yaml"]
        dest: "dump_yaml"
        action: "store_false"
        help: "Not dump the YAML schema for the dumped events. By default, the YAML schema will be dumped alongside the ROOT file."
    force-overwrite-yaml: &force_overwrite_yaml
        flags: ["--force-overwrite-yaml"]
        dest: "force_overwrite_yaml"
        action: "store_false"
        help: "Force overwrite the YAML schema if it already exists. By default, existing YAML schemas are preserved."
    also-dump: &also_dump
        flags: ["--also-dump"]
        dest: "also_dump"
        action: "store_true"
        help: "Also dump the events after the analysis."
    remove-nbranches: &remove_nbranches
        flags: ["--remove-nbranches"]
        dest: "remove_nbranches"
        action: "store_true"
        help: "Remove branches starting with 'n' from the output ROOT file. Default is False."
# ---------------------------------- posible analysis ---------------------------------------- #
pos_args:
    fill-histos:
        name: "fill-histos"
        help: "Fill predefined ROOT histograms based on event-by-event information from DT NTuple files."
        func: "dtpr.analysis.fill_histograms.fill_histos"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            output-path: *output_path
            tag: *tag
            max-files: *max_files
            max-events: *max_events
            cores-number: *cores_number
            no-merge: *no_merge
            job-id: *job_id
            job-count: *job_count
            also-dump: *also_dump
            remove_nbranches: *remove_nbranches
    dump-events:
        name: "dump-events"
        help: "Dump events from DT NTuple files into a new ROOT file after processing."
        func: "dtpr.analysis.dump_events.dump"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            output-path: *output_path
            tag: *tag
            max-files: *max_files
            max-events: *max_events
            cores-number: *cores_number
            no-merge: *no_merge
            job-id: *job_id
            job-count: *job_count
            format: *format
            dump-yaml: *dump_yaml
            force-overwrite-yaml: *force_overwrite_yaml
            remove_nbranches: *remove_nbranches
    plot-dt:
        name: "plot-dt"
        help: "Produce CMS DT chamber plot (local view) for a specific event digis information from a DT NTuple files."
        func: "dtpr.analysis.plot_dt_chamber.plot_dt_chamber"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            output-path: *output_path
            tag: *tag
            max-files: *max_files
            event-number: *event_number
            wheel: *wheel
            station: *station
            sector: *sector
            save: *save
            artist-names: *artist_names
    plot-dts:
        name: "plot-dts"
        help: "Produce CMS DT chamber plots (global view) based on event-by-event digis information from DT NTuple files."
        func: "dtpr.analysis.plot_dt_chambers.plot_dt_chambers"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            output-path: *output_path
            tag: *tag
            max-files: *max_files
            event-number: *event_number
            wheel: *wheel
            sector: *sector
            save: *save
            artist-names: *artist_names
    inspect-events:
        name: "inspect-events"
        help: "Inspect specific events from DT NTuple files."
        func: "dtpr.analysis.inspect_events.inspect_events"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            max-files: *max_files
            event-number: *event_number
    events-visualizer:
        name: "events-visualizer"
        help: "Launch the events visualizer for DT NTuple files."
        func: "dtpr.analysis.run_events_visualizer.open_visualizer"
        opt_args:
            config-path: *config_path
            input-path: *input_path
            max-files: *max_files
            use-executable: *use_executable
    # -------------------------------- posible create-templates ---------------------------------- #
    create-particle:
        name: "create-particle"
        help: "Create a new particle class template."
        func: "dtpr.utils.create_templates.create_particle_class_template"
        opt_args:
            output-path: *output_path
            template-name: *template_name
    create-config:
        name: "create-config"
        help: "Create a config file for running analysis."
        func: "dtpr.utils.create_templates.create_run_config_template"
        opt_args:
            output-path: *output_path
    create-analysis:
        name: "create-analysis"
        help: "Create a new analysis template."
        func: "dtpr.utils.create_templates.create_analysis_template"
        opt_args:
            output-path: *output_path
            template-name: *template_name
    create-histogram:
        name: "create-histo"
        help: "Create a new histogram template."
        func: "dtpr.utils.create_templates.create_histogram_template"
        opt_args:
            output-path: *output_path
            template-name: *template_name

            force-overwrite-yaml: *force_overwrite_yaml
